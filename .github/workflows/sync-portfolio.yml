name: Sync Behance Portfolio

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Behance RSS & optimize WebP covers
        run: npm run sync:portfolio

      - name: Commit and push if portfolio changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/portfolio/ src/data/projects.json
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en el portafolio de Behance."
          else
            git commit -m "chore(portfolio): sync Behance projects and WebP covers [skip ci]"
            git push origin HEAD:main
          fi
