<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradiente de fondo idéntico al de referencia -->
    <radialGradient id="bgGrad" cx="30%" cy="75%" r="85%">
      <stop offset="0%" stop-color="#1c1c22" />
      <stop offset="45%" stop-color="#0e0e12" />
      <stop offset="85%" stop-color="#020204" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Estilo de trazos técnicos -->
    <style>
      .tech-stroke {
        fill: none;
        stroke: rgba(246, 246, 246, 0.11);
        stroke-width: 1.5;
      }
      .tech-stroke-bright {
        fill: none;
        stroke: rgba(246, 246, 246, 0.18);
        stroke-width: 1.8;
      }
      .tech-dot {
        fill: rgba(246, 246, 246, 0.13);
      }
      .tech-capsule-faint {
        fill: rgba(255, 255, 255, 0.012);
        stroke: rgba(246, 246, 246, 0.09);
        stroke-width: 1.5;
      }
    </style>
  </defs>

  <!-- Fondo gradiente -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Grupo rotado a 45 grados centrado (Ángulo característico de la referencia) -->
  <g transform="translate(960, 540) rotate(-45)">

    <!-- ═══════════════════════════════════════════════════════
         1. CÁPSULAS Y PÍLDORAS PRINCIPALES (LARGAS Y FLOTANTES)
         ═══════════════════════════════════════════════════════ -->
    
    <!-- Gran cápsula central alargada que cruza cerca del logo -->
    <rect x="-850" y="-120" width="1700" height="70" rx="35" class="tech-capsule-faint" />
    
    <!-- Cápsula inferior derecha -->
    <rect x="250" y="220" width="620" height="84" rx="42" class="tech-capsule-faint" />

    <!-- Cápsula superior derecha -->
    <rect x="420" y="-360" width="580" height="90" rx="45" class="tech-stroke" />

    <!-- Cápsula media izquierda -->
    <rect x="-780" y="160" width="480" height="60" rx="30" class="tech-stroke" />

    <!-- ═══════════════════════════════════════════════════════
         2. GRUPOS DE LÍNEAS TÉCNICAS Y PUNTOS (CIRCUITOS / DASHES)
         ═══════════════════════════════════════════════════════ -->

    <!-- Bloque técnico 1: Superior izquierdo -->
    <g transform="translate(-480, -320)">
      <line x1="-120" y1="0" x2="80" y2="0" class="tech-stroke" />
      <line x1="-80" y1="18" x2="40" y2="18" class="tech-stroke" />
      <line x1="-140" y1="-18" x2="-20" y2="-18" class="tech-stroke-bright" />
      <circle cx="95" cy="0" r="3.5" class="tech-dot" />
      <circle cx="55" cy="18" r="3.5" class="tech-dot" />
      <circle cx="-155" cy="-18" r="3.5" class="tech-dot" />
      <!-- Puntos en fila -->
      <circle cx="115" cy="0" r="2.5" class="tech-dot" />
      <circle cx="130" cy="0" r="2.5" class="tech-dot" />
    </g>

    <!-- Bloque técnico 2: Superior derecho -->
    <g transform="translate(420, -180)">
      <line x1="-100" y1="0" x2="160" y2="0" class="tech-stroke" />
      <line x1="-50" y1="20" x2="110" y2="20" class="tech-stroke" />
      <line x1="-120" y1="-20" x2="60" y2="-20" class="tech-stroke-bright" />
      <circle cx="180" cy="0" r="3.5" class="tech-dot" />
      <circle cx="198" cy="0" r="3" class="tech-dot" />
      <circle cx="214" cy="0" r="2.5" class="tech-dot" />
      <circle cx="-140" cy="-20" r="3.5" class="tech-dot" />
    </g>

    <!-- Bloque técnico 3: Inferior izquierdo -->
    <g transform="translate(-520, 240)">
      <line x1="-160" y1="0" x2="120" y2="0" class="tech-stroke" />
      <line x1="-110" y1="22" x2="60" y2="22" class="tech-stroke-bright" />
      <line x1="-180" y1="-22" x2="20" y2="-22" class="tech-stroke" />
      <circle cx="-185" cy="0" r="3.5" class="tech-dot" />
      <circle cx="-200" cy="0" r="3" class="tech-dot" />
      <circle cx="-215" cy="0" r="2.5" class="tech-dot" />
      <circle cx="80" cy="22" r="3.5" class="tech-dot" />
      <circle cx="40" cy="-22" r="3.5" class="tech-dot" />
    </g>

    <!-- Bloque técnico 4: Inferior centro-derecha -->
    <g transform="translate(80, 360)">
      <line x1="-80" y1="0" x2="140" y2="0" class="tech-stroke" />
      <line x1="-40" y1="18" x2="90" y2="18" class="tech-stroke" />
      <line x1="-120" y1="-18" x2="30" y2="-18" class="tech-stroke-bright" />
      <circle cx="160" cy="0" r="3.5" class="tech-dot" />
      <circle cx="-138" cy="-18" r="3.5" class="tech-dot" />
      <circle cx="108" cy="18" r="3.5" class="tech-dot" />
    </g>

    <!-- Bloque técnico 5: Extremo inferior derecho -->
    <g transform="translate(680, 380)">
      <line x1="-70" y1="0" x2="80" y2="0" class="tech-stroke" />
      <line x1="-40" y1="16" x2="40" y2="16" class="tech-stroke" />
      <line x1="-90" y1="-16" x2="20" y2="-16" class="tech-stroke" />
      <circle cx="96" cy="0" r="3" class="tech-dot" />
      <circle cx="-106" cy="-16" r="3" class="tech-dot" />
    </g>

    <!-- Bloque técnico 6: Superior centro -->
    <g transform="translate(-80, -420)">
      <line x1="-90" y1="0" x2="110" y2="0" class="tech-stroke" />
      <line x1="-60" y1="16" x2="70" y2="16" class="tech-stroke" />
      <circle cx="126" cy="0" r="3" class="tech-dot" />
      <circle cx="140" cy="0" r="2.5" class="tech-dot" />
      <circle cx="-76" cy="16" r="3" class="tech-dot" />
    </g>

    <!-- ═══════════════════════════════════════════════════════
         3. CÍRCULOS AISLADOS DE REFERENCIA
         ═══════════════════════════════════════════════════════ -->
    <circle cx="140" cy="460" r="48" class="tech-stroke" />
    <circle cx="-680" cy="-80" r="36" class="tech-stroke" />

  </g>
</svg>
