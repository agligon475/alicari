<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALICARI — Vertical Dashboard (Monitor 2)</title>
  <meta name="description" content="Dashboard vertical modular para Wallpaper Engine y Lively Wallpaper — 20% Top / 40% Mid / 40% Bot — Monte Grande Clima." />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-icon.svg" />

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/vertical.css" />
</head>
<body>

  <!-- Fondo interactivo y partículas -->
  <div class="wallpaper-bg" aria-hidden="true"></div>
  <canvas id="particles-canvas" aria-hidden="true"></canvas>

  <!-- Escenario Vertical -->
  <main class="stage-vertical">

    <!-- ═══════════════════════════════════════════════════════
         HEADER DE MARCA Y ESTADO
         ═══════════════════════════════════════════════════════ -->
    <header class="dash-header">
      <div class="brand-badge">
        <img src="assets/images/logo-icon.svg" alt="Alicari" class="brand-icon-svg" />
        <h1 class="brand-title"><span>a</span>licari <span style="font-weight: 300; font-size: 0.8em; color: var(--text-muted);">// PORTRAIT</span></h1>
      </div>
      
      <div class="status-pill timer-pill" title="Actualización automática cada 20 segundos">
        <span class="status-dot green"></span>
        <span>SYNC</span>
        <span class="timer-countdown font-mono" id="finance-timer">20s</span>
      </div>
    </header>

    <!-- ═══════════════════════════════════════════════════════
         1. CAJAS SUPERIORES: 20% DE ALTO DE PANTALLA
         ═══════════════════════════════════════════════════════ -->
    <div class="row-top-20">

      <!-- COLUMNA 1: RELOJ POLAR CON NÚMEROS EXTERIORES -->
      <section class="glass-panel polar-clock-widget" aria-label="Reloj Polar">
        <div class="polar-container">
          <svg class="polar-svg-outer" viewBox="0 0 240 240">
            <!-- Números radiales de marcación por fuera de los aros -->
            <g class="polar-dial-numbers font-mono">
              <text x="120" y="16" text-anchor="middle" class="dial-num">00</text>
              <text x="226" y="124" text-anchor="middle" class="dial-num">06</text>
              <text x="120" y="234" text-anchor="middle" class="dial-num">12</text>
              <text x="14" y="124" text-anchor="middle" class="dial-num">18</text>
            </g>

            <!-- Marcas intermedias radiales exteriores -->
            <g class="polar-dial-ticks">
              <line x1="172" y1="30" x2="168" y2="37" class="dial-tick" />
              <line x1="210" y1="68" x2="203" y2="72" class="dial-tick" />
              <line x1="210" y1="172" x2="203" y2="168" class="dial-tick" />
              <line x1="172" y1="210" x2="168" y2="203" class="dial-tick" />
              <line x1="68" y1="210" x2="72" y2="203" class="dial-tick" />
              <line x1="30" y1="172" x2="37" y2="168" class="dial-tick" />
              <line x1="30" y1="68" x2="37" y2="72" class="dial-tick" />
              <line x1="68" y1="30" x2="72" y2="37" class="dial-tick" />
            </g>

            <!-- Arcos concéntricos dinámicos (Rotados -90deg para empezar a las 12) -->
            <g transform="rotate(-90 120 120)">
              <circle class="polar-track" cx="120" cy="120" r="84" />
              <circle class="polar-track" cx="120" cy="120" r="66" />
              <circle class="polar-track" cx="120" cy="120" r="48" />

              <circle class="polar-ring polar-ring-hours" id="polar-ring-hours" cx="120" cy="120" r="84" />
              <circle class="polar-ring polar-ring-minutes" id="polar-ring-minutes" cx="120" cy="120" r="66" />
              <circle class="polar-ring polar-ring-seconds" id="polar-ring-seconds" cx="120" cy="120" r="48" />
            </g>

            <!-- Centro del reloj polar con Isotipo Alicari 'a' -->
            <g transform="translate(108, 108) scale(0.03)" class="polar-center-logo">
              <path fill="#f60000" filter="drop-shadow(0 0 10px #f60000)" d="M560,180h0c-21.68,0-40.68,11.5-51.22,28.74-32.08-18.29-69.21-28.74-108.78-28.74-121.5,0-220,98.5-220,220s98.5,220,220,220c39.57,0,76.7-10.45,108.78-28.74,10.54,17.24,29.54,28.74,51.22,28.74h0c33.14,0,60-26.86,60-60V240c0-33.14-26.86-60-60-60ZM394.78,491.13c-47.25,0-85.56-38.31-85.56-85.56s38.31-85.56,85.56-85.56,85.56,38.31,85.56,85.56-38.3,85.56-85.56,85.56Z"/>
            </g>
          </svg>
        </div>

        <!-- Lectura digital integrada en 20% -->
        <div class="polar-clock-meta-side">
          <div class="polar-digital-row">
            <span class="polar-ext-time font-mono" id="clock-time">18<span class="clock-colon">:</span>00</span>
            <span class="polar-ext-sec font-mono" id="clock-seconds">:00</span>
          </div>
          <div class="polar-ext-date font-mono" id="clock-date">24 SEP 2026</div>
          <div class="polar-legend">
            <div class="polar-legend-item"><span class="legend-dot sec"></span><span>S</span></div>
            <div class="polar-legend-item"><span class="legend-dot min"></span><span>M</span></div>
            <div class="polar-legend-item"><span class="legend-dot hr"></span><span>H</span></div>
          </div>
        </div>
      </section>

      <!-- COLUMNA 2: CLIMA (MONTE GRANDE, BUENOS AIRES, ARGENTINA) -->
      <section class="glass-panel weather-widget" id="weather-widget" aria-label="Información Meteorológica">
        <div class="widget-header-bar">
          <div class="widget-title-group">
            <span class="widget-title">MONTE GRANDE // SMN</span>
            <span class="widget-subtitle">BUENOS AIRES, ARGENTINA</span>
          </div>
          <span class="status-dot"></span>
        </div>

        <div class="weather-hero-row">
          <div class="weather-temp-block">
            <div class="weather-temp-val" id="weather-temp">19<span class="unit">°C</span></div>
            <div class="weather-st-val" id="weather-st">ST 18°</div>
          </div>

          <div class="weather-visual-block">
            <div class="weather-icon-holder" id="weather-icon">
              <!-- SVG dinámico -->
            </div>
            <div class="weather-condition-text" id="weather-condition">Mayormente Despejado</div>
          </div>
        </div>

        <!-- Métricas meteorológicas horizontales -->
        <div class="weather-metrics-grid">
          <div class="metric-card">
            <span class="metric-label">HUM</span>
            <span class="metric-value" id="weather-humidity">68%</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">VIENTO</span>
            <span class="metric-value" id="weather-wind">14 km/h</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">PRES</span>
            <span class="metric-value" id="weather-pressure">1004 hPa</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">VIS</span>
            <span class="metric-value" id="weather-visibility">10.0 km</span>
          </div>
        </div>
      </section>

    </div>

    <!-- ═══════════════════════════════════════════════════════
         2. CAJAS MEDIAS: 40% DE ALTO DE PANTALLA (DIVISAS Y CRIPTOS)
         ═══════════════════════════════════════════════════════ -->
    <div class="row-mid-40">

      <!-- CAJA 1: DIVISAS -->
      <section class="glass-panel quad-box" aria-label="Divisas en ARS">
        <div class="quad-box-header">
          <span class="quad-box-title"><span class="dot-cat"></span>DIVISAS</span>
          <div class="sort-btn-group">
            <button class="sort-btn active" data-box="fiat" data-sort="desc" title="Ordenar por mayores subas">▲ Subieron</button>
            <button class="sort-btn" data-box="fiat" data-sort="asc" title="Ordenar por mayores bajas">▼ Bajaron</button>
          </div>
        </div>
        <div class="quad-list-container" id="list-fiat">
          <!-- Inyectado dinámicamente -->
        </div>
      </section>

      <!-- CAJA 2: CRIPTOMONEDAS -->
      <section class="glass-panel quad-box" aria-label="Criptomonedas en ARS">
        <div class="quad-box-header">
          <span class="quad-box-title"><span class="dot-cat"></span>CRIPTOS</span>
          <div class="sort-btn-group">
            <button class="sort-btn active" data-box="crypto" data-sort="desc" title="Ordenar por mayores subas">▲ Subieron</button>
            <button class="sort-btn" data-box="crypto" data-sort="asc" title="Ordenar por mayores bajas">▼ Bajaron</button>
          </div>
        </div>
        <div class="quad-list-container" id="list-crypto">
          <!-- Inyectado dinámicamente -->
        </div>
      </section>

    </div>

    <!-- ═══════════════════════════════════════════════════════
         3. CAJAS INFERIORES: 40% DE ALTO DE PANTALLA (CEDEARS E INVERSIONES)
         ═══════════════════════════════════════════════════════ -->
    <div class="row-bot-40">

      <!-- CAJA 3: CEDEARS -->
      <section class="glass-panel quad-box" aria-label="CEDEARs en ARS">
        <div class="quad-box-header">
          <span class="quad-box-title"><span class="dot-cat"></span>CEDEARS</span>
          <div class="sort-btn-group">
            <button class="sort-btn active" data-box="cedear" data-sort="desc" title="Ordenar por mayores subas">▲ Subieron</button>
            <button class="sort-btn" data-box="cedear" data-sort="asc" title="Ordenar por mayores bajas">▼ Bajaron</button>
          </div>
        </div>
        <div class="quad-list-container" id="list-cedear">
          <!-- Inyectado dinámicamente -->
        </div>
      </section>

      <!-- CAJA 4: SUGERENCIAS DE INVERSIÓN -->
      <section class="glass-panel quad-box" aria-label="Sugerencias de Inversión">
        <div class="quad-box-header">
          <span class="quad-box-title"><span class="dot-cat"></span>INVERSIONES</span>
          <div class="sort-btn-group">
            <button class="sort-btn active" data-box="insights" data-sort="desc" title="Ordenar por mayor potencial">▲ Subieron</button>
            <button class="sort-btn" data-box="insights" data-sort="asc" title="Ordenar por menor riesgo">▼ Bajaron</button>
          </div>
        </div>
        <div class="quad-list-container" id="list-insights">
          <!-- Inyectado dinámicamente -->
        </div>
      </section>

    </div>

    <!-- ═══════════════════════════════════════════════════════
         FOOTER DE TELEMETRÍA
         ═══════════════════════════════════════════════════════ -->
    <footer class="dash-footer">
      <div>ALICARI OS // 20-40-40 RATIO</div>
      <div>MONTE GRANDE, BS AS • LIVE</div>
    </footer>

  </main>

  <!-- Scripts Modulares -->
  <script src="assets/js/particles.js"></script>
  <script src="assets/js/clock.js"></script>
  <script src="assets/js/weather.js"></script>
  <script src="assets/js/finance.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Partículas sutiles verticales
      new ParticleEngine('particles-canvas', {
        particleCount: 35,
        mouseRadius: 120,
        baseSpeed: 0.25,
        redRatio: 0.25
      });

      // 2. Reloj Polar en tiempo real (con números exteriores)
      new ClockEngine({
        timeId: 'clock-time',
        secondsId: 'clock-seconds',
        dateId: 'clock-date'
      });

      // 3. SMN Weather Engine para Monte Grande, Buenos Aires
      new WeatherEngine({
        containerId: 'weather-widget',
        latitude: -34.8167,
        longitude: -58.4667,
        cityName: 'MONTE GRANDE, BUENOS AIRES',
        stationName: 'ESTACIÓN SMN // EZEIZA / MONTE GRANDE'
      });

      // 4. Finance & Investment Engine (4 cajas con ordenamiento independiente)
      new FinanceEngine();
    });
  </script>
</body>
</html>
